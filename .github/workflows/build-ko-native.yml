name: Build native .ko (kernel module)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'driver/kloader_driver.c'
      - 'driver/Makefile'
      - '.github/workflows/build-ko-native.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y git bc bison flex libssl-dev libelf-dev build-essential

      - name: Clone kernel source (4.9 tree)
        run: git clone --depth=1 https://github.com/Xtended-Devices/kernel_xiaomi_daisy $HOME/kernel

      - name: Clone GCC 4.9 toolchains (64-bit + 32-bit)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 $HOME/toolchain
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 $HOME/toolchain32
          ls $HOME/toolchain/bin | head -5
          ls $HOME/toolchain32/bin | head -5

      - name: Prepare kernel
        run: |
          cd $HOME/kernel
          export ARCH=arm64
          export PATH=$HOME/toolchain/bin:$HOME/toolchain32/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          make daisy_defconfig
          make -j$(nproc) modules_prepare

      - name: Build driver
        run: |
          export ARCH=arm64
          export PATH=$HOME/toolchain/bin:$HOME/toolchain32/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          make -C $HOME/kernel M=$GITHUB_WORKSPACE/driver ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-android- modules
          mkdir -p $GITHUB_WORKSPACE/driver/out
          KREL=$(cat $HOME/kernel/include/config/kernel.release)
          cp $GITHUB_WORKSPACE/driver/kloader_driver.ko \
             "$GITHUB_WORKSPACE/driver/out/native_${KREL}.ko"
          modinfo "$GITHUB_WORKSPACE/driver/out/native_${KREL}.ko" || \
            strings "$GITHUB_WORKSPACE/driver/out/native_${KREL}.ko" | grep -a -i -m 3 vermagic

      - name: Upload .ko
        uses: actions/upload-artifact@v4
        with:
          name: kloader-native-ko
          path: driver/out/native_*.ko
          if-no-files-found: error
